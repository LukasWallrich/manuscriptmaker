name: Build manuscript (PR preview)
on:
  pull_request:
    paths: ['manuscripts/**', '_extensions/**', 'themes/**', 'engine/**', 'tests/**', '_quarto.yml', 'requirements*.txt', '.github/workflows/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            matrix=$(python3 engine/scripts/detect_manuscripts.py --base "$BASE")
          else
            matrix=$(python3 engine/scripts/detect_manuscripts.py)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: quarto-dev/quarto-actions/setup@v2
        with: {version: '1.9.38'}
      - run: pip install -r requirements-dev.txt
      - name: Install PDF import and review tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pytest -q
  build:
    needs: [detect, tests]
    if: >-
      needs.detect.outputs.matrix != '{"id": []}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: quarto-dev/quarto-actions/setup@v2
        with: {version: '1.9.38', tinytex: true}
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y fonts-crosextra-carlito libreoffice-writer emf2svg libwmf-bin librsvg2-bin poppler-utils
          bash engine/scripts/install_tex.sh
      - name: Verify complete release pipeline
        if: matrix.id == 'R2.2025.001'
        run: R2_INTEGRATION=1 pytest -q -k release_pipeline
      - name: Build proofs
        env:
          ARTICLE_ID: ${{ matrix.id }}
        run: python engine/scripts/build.py "manuscripts/$ARTICLE_ID"
      - name: Upload proofs, editable snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-proofs
          path: _build/${{ matrix.id }}/
          retention-days: 30
