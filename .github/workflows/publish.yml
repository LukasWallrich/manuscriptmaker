name: Approve and publish reviewed proofs
# An editor selects the reviewed run explicitly. Publishing never re-renders it.
on:
  workflow_dispatch:
    inputs:
      article_id:
        description: Article folder ID (test fixtures are excluded)
        required: true
      run_id:
        description: Successful proof-build Actions run reviewed by the editor
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.article_id }}-proofs
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: _reviewed
      - name: Verify and stage approved proofs
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'engine/scripts')
          from stage_publication import stage
          article = os.environ['ARTICLE_ID']
          if Path(article).name != article or article.startswith('_'):
              raise SystemExit('Invalid article ID')
          manifests = list(Path('_reviewed').glob('*/manifest.json'))
          if len(manifests) != 1:
              raise SystemExit('Expected one reviewed proof bundle')
          stage(Path('manuscripts') / article, manifests[0].parent, Path('docs/articles') / article)
          PY
      - name: Commit approved artifacts
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "docs/articles/$ARTICLE_ID"
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved proofs for $ARTICLE_ID"
            git push origin HEAD:main
          fi
